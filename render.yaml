services:
  - type: web
    name: import-export-hub-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
